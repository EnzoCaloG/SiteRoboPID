<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID Telemetry // ESP32 Line Follower</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #131720;
      --border-color: #232a38;
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-red: #ff2a5f;
      --neon-purple: #b537f2;
      --text-main: #e2e8f0;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .title-box h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--neon-red);
      box-shadow: 0 0 8px var(--neon-red);
      transition: 0.3s;
    }

    .dot.connected {
      background-color: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
    }

    .btn-connect {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .btn-connect:hover {
      background: rgba(0, 243, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
    }

    .btn-connect.connected {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: var(--neon-green);
      color: #05140a;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .btn-stop {
      background: var(--neon-red);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.3);
    }

    .btn-invert {
      grid-column: span 2;
      background: var(--card-bg);
      color: var(--neon-purple);
      border: 1px solid var(--neon-purple);
      padding: 12px;
      font-size: 0.9rem;
    }

    .btn-status {
      grid-column: span 2;
      background: var(--card-bg);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 12px;
      font-size: 0.9rem;
    }

    .btn-status:hover {
      background: rgba(0, 243, 255, 0.15);
    }

    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .control-label span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    .value-input {
      background: #0a0c10;
      border: 1px solid var(--border-color);
      color: var(--neon-cyan);
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      width: 120px;
      padding: 6px 10px;
      border-radius: 6px;
      text-align: right;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0a0c10;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 8px;
    }

    .step-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .step-value-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.9rem;
      width: 70px;
      text-align: right;
      font-weight: bold;
    }

    .btn-step {
      background: #1d2330;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      flex: 1;
      height: 38px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: 0.1s;
    }

    .btn-step:active {
      background: var(--neon-cyan);
      color: #000;
    }

    .console-box {
      background: #07090c;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--neon-green);
      height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .console-line.sys { color: var(--text-muted); }
    .console-line.err { color: var(--neon-red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-box">
        <h1>PID Telemetry</h1>
        <div class="status-badge">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">Desconectado</span>
        </div>
      </div>
      <button class="btn-connect" id="btnConnect" onclick="toggleConnection()">Conectar BLE</button>
    </header>

    <div class="action-grid">
      <button class="btn-action btn-start" onclick="sendCommand('G')">▶ LIGAR</button>
      <button class="btn-action btn-stop" onclick="sendCommand('S')">■ Parar</button>
      <button class="btn-action btn-invert" onclick="sendCommand('X')">⇄ Inverter Sentido</button>
      <button class="btn-action btn-status" onclick="sendCommand('?')">🔍 Ler Valores Atuais</button>
    </div>

    <div class="control-card">
      <div class="control-header">
        <div class="control-label">Kp <span>(Proporcional)</span></div>
        <input type="number" step="0.001" id="num_P" class="value-input" value="0.050" onchange="updateFromInput('P', this.value)">
      </div>
      <div class="controls-row">
        <button class="btn-step" onclick="stepValue('P', -1)">- Passo</button>
        <button class="btn-step" onclick="stepValue('P', 1)">+ Passo</button>
        <div class="step-input-group">
          <span class="step-label">Passo:</span>
          <input type="number" step="0.001" id="step_P" class="step-value-input" value="0.005">
        </div>
      </div>
    </div>

    <div class="control-card">
      <div class="control-header">
        <div class="control-label">Ki <span>(Integral)</span></div>
        <input type="number" step="0.0001" id="num_I" class="value-input" value="0.0001" onchange="updateFromInput('I', this.value)">
      </div>
      <div class="controls-row">
        <button class="btn-step" onclick="stepValue('I', -1)">- Passo</button>
        <button class="btn-step" onclick="stepValue('I', 1)">+ Passo</button>
        <div class="step-input-group">
          <span class="step-label">Passo:</span>
          <input type="number" step="0.0001" id="step_I" class="step-value-input" value="0.0001">
        </div>
      </div>
    </div>

    <div class="control-card">
      <div class="control-header">
        <div class="control-label">Kd <span>(Derivativo)</span></div>
        <input type="number" step="0.01" id="num_D" class="value-input" value="0.50" onchange="updateFromInput('D', this.value)">
      </div>
      <div class="controls-row">
        <button class="btn-step" onclick="stepValue('D', -1)">- Passo</button>
        <button class="btn-step" onclick="stepValue('D', 1)">+ Passo</button>
        <div class="step-input-group">
          <span class="step-label">Passo:</span>
          <input type="number" step="0.01" id="step_D" class="step-value-input" value="0.05">
        </div>
      </div>
    </div>

    <div class="control-card">
      <div class="control-header">
        <div class="control-label">Vel. Base <span>(0 - 255)</span></div>
        <input type="number" step="1" id="num_V" class="value-input" value="120" onchange="updateFromInput('V', this.value)">
      </div>
      <div class="controls-row">
        <button class="btn-step" onclick="stepValue('V', -1)">- Passo</button>
        <button class="btn-step" onclick="stepValue('V', 1)">+ Passo</button>
        <div class="step-input-group">
          <span class="step-label">Passo:</span>
          <input type="number" step="1" id="step_V" class="step-value-input" value="5">
        </div>
      </div>
    </div>

    <div class="control-card">
      <div class="control-header">
        <div class="control-label">Vel. Máxima <span>(Limite)</span></div>
        <input type="number" step="1" id="num_M" class="value-input" value="255" onchange="updateFromInput('M', this.value)">
      </div>
      <div class="controls-row">
        <button class="btn-step" onclick="stepValue('M', -1)">- Passo</button>
        <button class="btn-step" onclick="stepValue('M', 1)">+ Passo</button>
        <div class="step-input-group">
          <span class="step-label">Passo:</span>
          <input type="number" step="1" id="step_M" class="step-value-input" value="5">
        </div>
      </div>
    </div>

    <div class="console-box" id="consoleLog">
      <div class="console-line sys">> Sistema pronto. Clique em "Conectar BLE" para parear com o ESP32.</div>
    </div>
  </div>

  <script>
    const SERVICE_UUID        = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let bleDevice = null;
    let bleCharacteristic = null;

    function logMsg(msg, type = '') {
      const box = document.getElementById('consoleLog');
      const line = document.createElement('div');
      line.className = 'console-line ' + type;
      line.textContent = '> ' + msg;
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
    }

    async function toggleConnection() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      if (!navigator.bluetooth) {
        logMsg('Erro: Web Bluetooth não suportado neste navegador. Use o Chrome no Android ou no computador.', 'err');
        return;
      }

      try {
        logMsg('Procurando ESP32...', 'sys');

        // Dois filtros (funcionam como "OU"): acha pelo UUID do serviço OU pelo nome
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { services: [SERVICE_UUID] },
            { name: 'Robo_PID_Web' }
          ],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        logMsg('Conectando ao servidor GATT...', 'sys');
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        try {
          await bleCharacteristic.startNotifications();
          bleCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
            const value = new TextDecoder().decode(event.target.value);
            logMsg('ESP32: ' + value);
          });
        } catch (e) {
          logMsg('Aviso: notificações indisponíveis.', 'sys');
        }

        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Conectado (' + (bleDevice.name || 'ESP32') + ')';
        const btn = document.getElementById('btnConnect');
        btn.textContent = 'Desconectar';
        btn.classList.add('connected');
        logMsg('Conectado com sucesso!', '');

      } catch (error) {
        logMsg('Falha na conexão: ' + error.message, 'err');
      }
    }

    function onDisconnected() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = 'Desconectado';
      const btn = document.getElementById('btnConnect');
      btn.textContent = 'Conectar BLE';
      btn.classList.remove('connected');
      bleCharacteristic = null;
      logMsg('Dispositivo desconectado.', 'err');
    }

    async function sendCommand(cmdStr) {
      logMsg('Enviando: ' + cmdStr, 'sys');
      if (!bleCharacteristic) {
        logMsg('Aviso: Bluetooth não conectado!', 'err');
        return;
      }

      try {
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(cmdStr + '\n'));
      } catch (error) {
        logMsg('Erro ao enviar: ' + error.message, 'err');
      }
    }

    function formatDecimals(param, val) {
      const num = parseFloat(val);
      if (isNaN(num)) return '0';
      if (param === 'P') return num.toFixed(3);
      if (param === 'I') return num.toFixed(4);
      if (param === 'D') return num.toFixed(2);
      return Math.round(num).toString();
    }

    function updateFromInput(param, val) {
      const formatted = formatDecimals(param, val);
      document.getElementById('num_' + param).value = formatted;
      sendCommand(param + formatted);
    }

    function stepValue(param, direction) {
      const input = document.getElementById('num_' + param);
      const stepInput = document.getElementById('step_' + param);

      let currentVal = parseFloat(input.value) || 0;
      let stepVal = parseFloat(stepInput.value) || 1;

      let newVal = currentVal + (direction * stepVal);

      if (param === 'V' || param === 'M') {
        newVal = Math.max(0, Math.min(255, newVal));
      } else if (newVal < 0) {
        newVal = 0;
      }

      const formatted = formatDecimals(param, newVal);
      input.value = formatted;
      sendCommand(param + formatted);
    }
  </script>
</body>
</html>
